name: kokoko
options:
  bundleIdPrefix: la.lex
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"

packages:
  Kokoko:
    path: .
  ASCIIUI:
    url: https://github.com/lexfrei/ascii-ui.git
    revision: 85c5eef4e8bcb539892329842f6f8ef00c168851

targets:
  kokoko:
    type: application
    platform: iOS
    sources:
      - App/Sources
    info:
      path: App/Info.plist
      properties:
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: la.lex.kokoko.sound-row-move
            UTTypeDescription: kokoko sound row move
            UTTypeConformsTo: [public.data]
    settings:
      base:
        SDKROOT: auto
        SUPPORTED_PLATFORMS: iphoneos iphonesimulator macosx
        TARGETED_DEVICE_FAMILY: "1,2"
        PRODUCT_BUNDLE_IDENTIFIER: la.lex.kokoko
        PRODUCT_NAME: kokoko
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        ENABLE_APP_SANDBOX: NO
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        SWIFT_VERSION: "6.0"
    dependencies:
      - package: Kokoko
        product: KokokoCore
      - package: Kokoko
        product: KokokoMIDI
      - package: Kokoko
        product: KokokoAudio
      - package: Kokoko
        product: KokokoLibrary
      - package: ASCIIUI
        product: ASCIIUI
